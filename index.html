/* ---------- prayer time calculation (Umm al-Qura style, approximate) ---------- */
const CITY={makkah:{n:'Makkah',lat:21.4225,lng:39.8262},madinah:{n:'Madinah',lat:24.4672,lng:39.6111}};
const rad=d=>d*Math.PI/180, deg=r=>r*180/Math.PI;
const fix=(a,b)=>{a=a-b*Math.floor(a/b);return a<0?a+b:a};
function julian(y,m,d){if(m<=2){y--;m+=12}const A=Math.floor(y/100),B=2-A+Math.floor(A/4);return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5}
function sun(jd){const D=jd-2451545,g=fix(357.529+0.98560028*D,360),q=fix(280.459+0.98564736*D,360),
 L=fix(q+1.915*Math.sin(rad(g))+0.020*Math.sin(rad(2*g)),360),e=23.439-0.00000036*D,
 RA=deg(Math.atan2(Math.cos(rad(e))*Math.sin(rad(L)),Math.cos(rad(L))))/15,
 decl=deg(Math.asin(Math.sin(rad(e))*Math.sin(rad(L)))),eqt=q/15-fix(RA,24);return{decl,eqt}}
function times(y,m,d,c){
 const jd=julian(y,m,d)-c.lng/(15*24), tz=c.tz||3, {decl,eqt}=sun(jd+0.5);
 const noon=12+tz-c.lng/15-eqt;
 const T=a=>deg(Math.acos((-Math.sin(rad(a))-Math.sin(rad(decl))*Math.sin(rad(c.lat)))/(Math.cos(rad(decl))*Math.cos(rad(c.lat)))))/15;
 const asrAlt=-deg(Math.atan(1/(1+Math.tan(rad(Math.abs(c.lat-decl))))));
 const fajr=noon-T(18.5), sunrise=noon-T(0.833), sunset=noon+T(0.833), asr=noon+T(asrAlt);
 return{fajr,sunrise,dhuhr:noon+2/60,asr,maghrib:sunset+1/60,isha:sunset+1/60+1.5};
}
const hm=h=>{h=fix(h,24);let H=Math.floor(h),M=Math.round((h-H)*60);if(M===60){H=(H+1)%24;M=0}return String(H).padStart(2,'0')+':'+String(M).padStart(2,'0')};

function skyUpdate(my,sa){
 const isDay=(pt,c)=>{const t=times(pt.y,pt.m,pt.d,c),h=pt.h+pt.mi/60;return h>=t.sunrise&&h<t.maghrib};
 [['skyMY',isDay(my,{lat:5.30,lng:100.37,tz:8})],['skySA',isDay(sa,CITY[S.city])]].forEach(([id,d])=>{
  if(SKY[id]===d)return;SKY[id]=d;const el=document.getElementById(id);if(!el)return;
  el.innerHTML=(d?SUN:MOON)+'<span class="skyt">'+(d?'Siang':'Malam')+'</span>';el.title=d?'Siang':'Malam';});
}
function partsIn(tz){const f=new Intl.DateTimeFormat('en-GB',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
 const o={};f.formatToParts(new Date()).forEach(p=>o[p.type]=p.value);return{y:+o.year,m:+o.month,d:+o.day,h:+o.hour%24,mi:+o.minute,s:+o.second}}

function liveUpdate(){
 const {sa,t}=todayTimes(), now=sa.h+sa.mi/60+sa.s/3600, MY=h=>hm(h+5);
 const rows=[['Subuh',t.fajr],['Syuruk',t.sunrise],['Zohor',t.dhuhr],['Asar',t.asr],['Maghrib',t.maghrib],['Isyak',t.isha]];
 let nextIdx=rows.findIndex(r=>r[0]!=='Syuruk'&&r[1]>now);
 const tb=document.getElementById('ptbody');
 if(tb) tb.innerHTML=rows.map((r,i)=>`<tr class="${i===nextIdx?'next':''}"><td>${r[0]}</td><td class="sa">${hm(r[1])}</td><td class="my">${MY(r[1])}</td></tr>`).join('');
 const np=document.getElementById('nextp');
 if(np){if(nextIdx<0){np.textContent='Seterusnya: Subuh esok, kira-kira '+hm(t.fajr)+' waktu Saudi.'}else{const diff=rows[nextIdx][1]-now,H=Math.floor(diff),M=Math.floor((diff-H)*60);np.textContent=`Seterusnya: ${rows[nextIdx][0]} dalam ${H?H+' jam ':''}${M} minit`;}}
 const night=(t.fajr+24)-t.maghrib, third=fix(t.maghrib+night*2/3,24), mid=fix(t.maghrib+night/2,24);
 const jumaat=new Date(Date.UTC(sa.y,sa.m-1,sa.d)).getUTCDay()===5;
 const inR=(a,b)=>a<=b?(now>=a&&now<b):(now>=a||now<b);
 const B=[
  [third,t.fajr,'Sepertiga malam terakhir','Allah turun ke langit dunia dan bertanya siapa yang berdoa. Waktu terbaik untuk tahajjud, istighfar dan doa hajat.'],
  [t.fajr-0.5,t.fajr,'Waktu sahur / sebelum Subuh','Waktu istighfar (Ali Imran: 17).'],
  [t.sunrise+0.33,t.dhuhr-0.17,'Waktu Dhuha','Solat Dhuha 2–8 rakaat. Waktu sesuai untuk tawaf sunat bagi wanita kerana lebih lapang.'],
  ...[['Subuh',t.fajr],['Zohor',t.dhuhr],['Asar',t.asr],['Maghrib',t.maghrib],['Isyak',t.isha]].map(([n,x])=>[x,x+(n==='Maghrib'?0.12:0.25),'Antara azan & iqamah '+n,'Doa antara azan dan iqamah tidak ditolak (Abu Daud, Tirmizi). Juga berdoa selepas salam solat fardu.']),
  [t.asr,t.maghrib,jumaat?'Jumaat: saat terakhir selepas Asar':'Petang Jumaat (selepas Asar)',jumaat?'Hari ini Jumaat — ada satu saat mustajab, ramai ulama berpendapat menjelang Maghrib.':'Hanya pada hari Jumaat. Perbanyak doa dan selawat.'],
 ].sort((a,b)=>fix(a[0]-t.fajr+1,24)-fix(b[0]-t.fajr+1,24));
 const bk=document.getElementById('berkat');
 if(bk){bk.innerHTML=B.map(b=>{const live=inR(fix(b[0],24),fix(b[1],24))&&(!b[2].startsWith('Petang Jumaat'));return `<div class="bk ${live?'live':''}"><div class="when">${hm(b[0])}–${hm(b[1])}<span>MY ${MY(b[0])}–${MY(b[1])}</span></div><b>${b[2]}${live?' <span class="tag w">Sekarang</span>':''}</b><p>${b[3]}</p></div>`}).join('')+
  `<div class="bk"><div class="when">Bila-bila<span>sepanjang hari</span></div><b>Mustajab pada keadaan tertentu</b><p>Ketika pertama melihat Kaabah · ketika sujud · ketika minum zamzam · di Multazam · di Safa & Marwah · di Raudhah · ketika hujan · ketika musafir · selepas khatam Quran.</p></div>`;}
 const rt=document.getElementById('routine');
 if(rt){const R2=[
  [t.fajr-1.25,'Bangun, wuduk, ke masjid','Tahajjud, witir & doa sepertiga malam terakhir.'],
  [t.fajr,'Solat Subuh berjemaah','Kekal berzikir hingga syuruk jika mampu.'],
  [t.sunrise+0.5,'Sarapan & rehat','Tidur sebentar — tenaga untuk hari panjang.'],
  [t.sunrise+2,'Dhuha + tawaf sunat / ziarah',S.city==='makkah'?'Waktu tawaf lebih lapang untuk wanita.':'Ziarah Quba (Sabtu ialah sunnah) atau tadarus di masjid.'],
  [t.dhuhr-0.5,'Ke masjid untuk Zohor','Masuk awal untuk dapat ruang wanita.'],
  [t.dhuhr+0.75,'Makan tengah hari & qailulah','Tidur sebentar ketika matahari paling panas.'],

  [t.isha+1,'Makan malam & tidur awal','Pasang penggera untuk tahajjud.']];
  rt.innerHTML=R2.map(r=>`<div class="bk"><div class="when">${hm(r[0])}<span>MY ${MY(r[0])}</span></div><b>${r[1]}</b><p>${r[2]}</p></div>`).join('');}
 const cd=document.getElementById('cd'),cdx=document.getElementById('cdx');
 if(cd&&S.depart){const my=partsIn('Asia/Kuala_Lumpur');const a=Date.UTC(my.y,my.m-1,my.d),[y,m,d]=S.depart.split('-').map(Number),b=Date.UTC(y,m-1,d);const n=Math.round((b-a)/864e5);

/* ---------- daily store helpers ---------- */
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayKey=()=>{try{const k=saKey();if(k>=TRIP[0].d&&k<=TRIP[TRIP.length-1].d)return k}catch(e){}return dkey(new Date())};
function fridayDate(){const d=new Date();d.setDate(d.getDate()+((5-d.getDay()+7)%7));return d}
function day(k){S.daily=S.daily||{};return S.daily[k]||(S.daily[k]={checks:{},counts:{}})}
function prune(){const lim=Date.now()-400*864e5;Object.keys(S.daily||{}).forEach(k=>{const [y,m,d]=k.split('-').map(Number);if(new Date(y,m-1,d).getTime()<lim)delete S.daily[k]})}
function dailyList(grp,key,items){const d=day(key);
 return `<ul class="check">`+items.map((it,i)=>{const id=grp+'-'+i,uid=`dc-${key}-${id}`;
  return `<li><label for="${uid}"><input type="checkbox" id="${uid}" data-day="${key}" data-id="${id}" data-grp="${grp}" ${d.checks[id]?'checked':''}><span class="tx"><b>${it[0]}</b>${it[1]||''}${it[2]?`<small>${it[2]}</small>`:''}</span></label>${it[3]?`<details class="zar" open><summary>Teks Arab</summary><div class="ar" lang="ar">${it[3]}</div></details>`:''}</li>`}).join('')+`</ul>`}
function dailyProg(grp,key,n){const d=day(key);let c=0;for(let i=0;i<n;i++)if(d.checks[grp+'-'+i])c++;
 return `<div class="prog" id="dp-${grp}" data-n="${n}" data-key="${key}"><div class="bar"><i style="width:${Math.round(c/n*100)}%"></i></div><span class="pct">${c}/${n}</span></div>`}
const MYh=h=>hm(h+5);
const winHTML=(a,b,l='Saudi')=>`<div class="window"><div class="win"><div class="lbl">${l}</div><b>${hm(a)} – ${hm(b)}</b></div><div class="win"><div class="lbl">Malaysia</div><b>${MYh(a)} – ${MYh(b)}</b></div></div>`;
const segHTML=()=>`<div class="seg" role="group" aria-label="Pilih bandar"><button data-city="makkah" aria-pressed="${S.city==='makkah'}">Makkah</button><button data-city="madinah" aria-pressed="${S.city==='madinah'}">Madinah</button></div>`;

function zikirView(){const tk=todayKey();
 return `<div><h2>Zikir & Selawat</h2><p class="lead">Tekan bulatan untuk mengira. Kiraan disimpan untuk hari ini dan bermula semula esok.</p></div>
 <div class="panel"><h3>Selawat 1000 kali sehari</h3>
  <div class="ar" lang="ar" style="text-align:center">${SEL_AR}</div><div class="rumi" style="text-align:center">${SEL_RUMI}</div>
  <p class="mk" style="text-align:center;margin:4px 0 14px">"Sesiapa berselawat ke atasku sekali, Allah berselawat ke atasnya sepuluh kali." (Muslim)</p>
  <div class="counter"><button class="tap" id="tapSel" data-act="inc" data-z="selawat" data-n="1" aria-label="Tambah satu selawat" style="--p:0"><span class="in"><span class="n" id="n-selawat">0</span><span class="of">daripada ${SEL_TARGET} · tekan</span></span></button>
   <div class="btns"><button class="btn" data-act="inc" data-z="selawat" data-n="10">+10</button><button class="btn" data-act="inc" data-z="selawat" data-n="100">+100</button><button class="btn ghost" data-act="inc" data-z="selawat" data-n="-1">Tolak 1</button><button class="btn ghost" data-act="reset" data-z="selawat">Set semula</button></div>
   <p class="muted" id="sel-msg" style="font-size:.85rem;margin:0;text-align:center"></p></div></div>
 <div class="panel soft"><h3>Pecahan mudah 1000</h3><p style="margin:0">200 kali selepas setiap solat fardu = 1000 sehari. Boleh juga dibaca ketika menunggu solat, dalam bas ziarah, atau sebelum tidur.</p></div>
 <div class="panel"><h3>Selawat 7 hari terakhir</h3><div class="week" id="week"></div></div>
 <div class="panel"><h3>Tasbih & zikir harian</h3><div>${ZK.map(z=>`<div class="zk"><div style="min-width:0"><div class="ar" lang="ar">${z.ar}</div><div class="rumi">${z.r}</div><div class="mk">${z.m}</div></div><div class="ctl"><button class="plus" id="p-${z.id}" data-act="inc" data-z="${z.id}" data-n="1" aria-label="Tambah ${z.r}">0</button><span class="muted" style="font-size:.75rem">sasaran ${z.t}</span><div class="sub"><button class="tiny" data-act="inc" data-z="${z.id}" data-n="-1">−1</button><button class="tiny" data-act="reset" data-z="${z.id}">Sifar</button></div></div></div>`).join('')}</div></div>
 <div class="panel"><h3>Zikir pagi (selepas Subuh)</h3>${dailyProg('pagi',tk,ZP.length)}${dailyList('pagi',tk,ZP)}</div>
 <div class="panel"><h3>Zikir petang (selepas Asar)</h3>${dailyProg('petang',tk,ZP.length)}${dailyList('petang',tk,ZP)}</div>
 <div class="panel"><h3>Wirid selepas solat fardu</h3><div class="ar wirid-ar" lang="ar">أَسْتَغْفِرُ اللّٰهَ ×٣ · سُبْحَانَ اللّٰهِ ×٣٣ · الْحَمْدُ لِلّٰهِ ×٣٣ · اللّٰهُ أَكْبَرُ ×٣٤</div>${dailyProg('wirid',tk,WIRID.length)}${dailyList('wirid',tk,WIRID)}</div>`}

function updateCounts(){
 const d=day(todayKey()), s=d.counts.selawat||0;
 const n=document.getElementById('n-selawat');
 if(n){n.textContent=s;document.getElementById('tapSel').style.setProperty('--p',Math.min(100,s/SEL_TARGET*100));
  document.getElementById('sel-msg').textContent=s>=SEL_TARGET?'Alhamdulillah, sasaran 1000 hari ini tercapai.':`Baki ${SEL_TARGET-s} lagi untuk hari ini`;}
 ZK.forEach(z=>{const b=document.getElementById('p-'+z.id);if(b){const c=d.counts[z.id]||0;b.textContent=c;b.classList.toggle('done',c>=z.t)}});
 const w=document.getElementById('week');
 if(w){let h='';for(let i=6;i>=0;i--){const dt=new Date();dt.setDate(dt.getDate()-i);const k=dkey(dt);const c=(S.daily&&S.daily[k]&&S.daily[k].counts.selawat)||0;
  h+=`<div class="col"><span>${c}</span><div class="b ${c>=SEL_TARGET?'full':''}" style="height:${Math.max(3,Math.min(1,c/SEL_TARGET)*56)}px"></div><span>${i===0?'Hari ini':new Intl.DateTimeFormat('ms-MY',{weekday:'short'}).format(dt)}</span></div>`}
  w.innerHTML=h}
 const hs=document.getElementById('home-sel');if(hs)hs.textContent=s+' / 1000 hari ini';
}

const PH=[

 {k:'pulang',n:'Pulang ke hotel',c:'#8b5cf6'}];
const STRIDE=0.68;
function PHK(k){return PH.find(p=>p.k===k)||{k:String(k),n:String(k),c:'#888'}}
function fmtDur(ms){ms=Math.max(0,(+ms)||0);const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}:${pad(m)}:${pad(x)}`:`${m}:${pad(x)}`}
function fmtDist(m){m=(+m)||0;return m>=1000?(m/1000).toFixed(2)+' km':Math.round(m)+' m'}
const saKeyOf=ms=>{try{return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Riyadh'}).format(new Date(ms))}catch(e){return saKey()}};

let SESS=null;try{SESS=JSON.parse(localStorage.getItem('umrahSess')||'null')}catch(e){SESS=null}
if(SESS&&(!Array.isArray(SESS.phases)||!SESS.phases.length))SESS=null;
if(SESS&&!SESS.end&&SESS.hiddenAt){SESS.gaps=(SESS.gaps||0)+1;SESS.hiddenAt=null}
let sessW=0;
function sessLocal(){try{SESS?localStorage.setItem('umrahSess',JSON.stringify(SESS)):localStorage.removeItem('umrahSess')}catch(e){}}
function sessSum(s){return {id:s.id,start:s.start,end:s.end||null,cur:s.cur,gaps:s.gaps||0,phases:s.phases.map(p=>({k:p.k,t0:p.t0,t1:p.t1||null,dist:Math.round(p.dist||0),rounds:p.rounds||0}))}}
function sessSave(force){sessLocal();if(!tripRef||!SESS)return;const n=Date.now();if(!force&&n-sessW<25000)return;sessW=n;tripRef.set({sess:sessSum(SESS)},{merge:true}).catch(()=>{})}
function sessActive(){return !!(SESS&&!SESS.end)}
function sessStart(i){
 const m=document.getElementById('trkMsg')||document.getElementById('sessMsg');
 if(!tripRef){if(m)m.textContent='Sediakan pautan keluarga dahulu.';return}
 if(!tracking())startTracking(false);
 const n=Date.now();SESS={id:n.toString(36),start:n,cur:i,phases:[{k:PH[i].k,t0:n,t1:null,dist:0,rounds:0}],gaps:0,lastPt:null,end:null};
 sessSave(true);last.ts=0;renderLive();openMini();
}
function sessNext(){if(!sessActive())return;const n=Date.now();SESS.phases[SESS.phases.length-1].t1=n;SESS.cur++;
 if(SESS.cur>=PH.length){SESS.cur=PH.length-1;return sessEnd()}
 SESS.phases.push({k:PH[SESS.cur].k,t0:n,t1:null,dist:0,rounds:0});sessSave(true);last.ts=0;renderLive();sessMiniKey='';}
function sessEnd(at){if(!SESS||SESS.end)return;const n=at||Date.now();const c=SESS.phases[SESS.phases.length-1];if(!c.t1)c.t1=n;SESS.end=n;SESS.lastPt=null;
 const sum=sessSum(SESS);if(tripRef)tripRef.set({sess:sum,sessHist:firebase.firestore.FieldValue.arrayUnion(sum)},{merge:true}).catch(()=>{});
 sessLocal();renderLive();sessMiniKey='';}
function sessFixSave(){sessLocal();if(!tripRef||!SESS)return;const sum=sessSum(SESS);
 if(!LIVE.ready||!Array.isArray(LIVE.doc&&LIVE.doc.sessHist)||!LIVE.doc.sessHist.some(x=>x&&x.id===SESS.id)){tripRef.set({sess:sum},{merge:true}).catch(()=>{});return}const h=((LIVE.doc&&LIVE.doc.sessHist)||[]).map(x=>x&&x.id===SESS.id?sum:x);
 tripRef.set({sess:sum,sessHist:h},{merge:true}).catch(()=>{})}
function roundAdd(d,idx){if(!SESS||(idx==null&&SESS.end))return;const p=idx!=null?SESS.phases[idx]:SESS.phases[SESS.phases.length-1];const P=PHK(p.k);if(!P.laps)return;
 p.rounds=Math.max(0,Math.min(P.laps,(p.rounds||0)+d));try{navigator.vibrate&&navigator.vibrate(d>0?30:10)}catch(e){}
 if(idx!=null)sessFixSave();else sessSave(true);renderLive();sessMiniKey='';sessTick();}
function sessOnFix(c,now){
 if(!sessActive()||!(c.accuracy<=40))return;const p={lat:c.latitude,lng:c.longitude,ts:now};
 if(SESS.lastPt){const d=meters([SESS.lastPt.lat,SESS.lastPt.lng],[p.lat,p.lng]),dt=Math.max(1,(now-SESS.lastPt.ts)/1000);
  if(d<Math.max(4,c.accuracy*0.4))return;
  if(d/dt<=7||dt>60)SESS.phases[SESS.phases.length-1].dist+=d}
 SESS.lastPt=p;sessSave(false);
}

let GEO={lat:0,lng:0,ts:0,addr:''},geoBusy=false;
function geoAddrNear(lat,lng){return GEO.addr&&meters([GEO.lat,GEO.lng],[lat,lng])<150?GEO.addr:null}
async function revGeo(lat,lng){const n=Date.now();if(geoBusy||n-GEO.ts<45000||(GEO.addr&&meters([GEO.lat,GEO.lng],[lat,lng])<60))return;geoBusy=true;
 try{const ac=new AbortController();const to=setTimeout(()=>ac.abort(),10000);const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat.toFixed(6)}&lon=${lng.toFixed(6)}&zoom=18&addressdetails=1&accept-language=ms,en`,{signal:ac.signal});clearTimeout(to);
  const j=await r.json();const a=j.address||{};const parts=[];const road=a.road||a.pedestrian||a.footway||a.path||a.square;
  if(j.name&&j.name!==road)parts.push(j.name);if(road)parts.push(road);
  const area=a.neighbourhood||a.suburb||a.quarter||a.city_district||a.village||a.hamlet;if(area)parts.push(area);
  const city=a.city||a.town||a.municipality||a.county||a.state;if(city)parts.push(city);
  const addr=[...new Set(parts.map(String))].slice(0,4).join(', ').slice(0,160);GEO={lat,lng,ts:n,addr};
  if(addr&&tripRef)tripRef.set({pos:{addr}},{merge:true}).catch(()=>{});
 }catch(e){GEO.ts=n}geoBusy=false}
const GENZ=['lain','makkah','madinah','jeddah','jalan'];
function posTitle(p){if(!p)return '';const a=typeof p.addr==='string'?p.addr:'';
 if(p.zone==='jalan')return 'Dalam perjalanan'+((+p.spd)>0?' · '+(+p.spd|0)+' km/j':'');
 if(a&&GENZ.includes(p.zone))return a.split(', ')[0];return String(p.label||'')}
function posSub(p){if(!p)return '';const a=typeof p.addr==='string'?p.addr:'';if(!a)return '';
 if(p.zone==='jalan')return a;if(GENZ.includes(p.zone))return a.split(', ').slice(1).join(', ');return a}

function sessData(){if(ROLE==='isteri')return SESS;const s=LIVE.doc&&LIVE.doc.sess;return s&&Array.isArray(s.phases)&&s.phases.length?s:null}
function histList(){const h=(LIVE.doc&&LIVE.doc.sessHist)||[];return Array.isArray(h)?h.filter(x=>x&&Array.isArray(x.phases)):[]}
function histHTML(){const h=histList();if(!h.length)return '';
 return `<div class="glbl" style="margin-top:14px">Rakaman umrah sebelum ini</div>`+h.slice().reverse().slice(0,6).map(s=>{const t=((+s.end)||(+s.start))-(+s.start),d=s.phases.reduce((a,p)=>a+((+p.dist)||0),0);
  const tw=s.phases.find(p=>p.k==='tawaf'),sa=s.phases.find(p=>p.k==='saie');
  return `<div class="srow h3c"><span class="sn">${esc(dayLabel(saKeyOf(+s.start)))} · ${fmtAt(+s.start,'Asia/Riyadh')}${tw?` <em>tawaf ${+tw.rounds|0}/7</em>`:''}${sa?` <em>sa'ie ${+sa.rounds|0}/7</em>`:''}</span><span>${fmtDur(t)}</span><span>${fmtDist(d)}</span></div>`}).join('')}
function histPanel(){const x=histHTML();return x?`<div class="panel"><h3>Fasa ibadah</h3>${x}</div>`:''}
function sessPanelHTML(){
 const s=sessData(),isteri=ROLE==='isteri',act=!!(s&&!s.end);
 let h=`<div class="row" style="justify-content:space-between;margin-bottom:6px"><h3 style="margin:0">Fasa ibadah</h3>${act?'<span class="tag rec">● Merakam</span>':s?`<span class="tag s">Selesai ${fmtAt(+s.end,'Asia/Riyadh')}</span>`:''}</div>`;
 if(!s){h+=isteri?`<p class="mk" style="margin:0 0 10px">Rakam setiap bahagian umrah — masa, jarak, anggaran langkah dan pusingan. Suami nampak secara langsung, dan laluan diwarnakan ikut bahagian.</p>

  :`<p class="muted" style="margin:0">Belum ada rakaman umrah. Isteri boleh mula rakam dari tab Lokasi.</p>`;return h+histHTML()}
 const cur=s.phases[s.phases.length-1],P=PHK(cur.k);
 if(act){const est=P.laps?Math.min(P.laps,Math.floor(((+cur.dist)||0)/P.lap)):0;
  h+=`<div class="scur"><span class="sdot" style="background:${P.c}"></span><div style="min-width:0"><div class="glbl" style="margin:0">Sekarang</div><div class="sname">${esc(P.n)}</div></div><div class="stime" id="sessTimer">${fmtDur(Date.now()-(+cur.t0))}</div></div>`;
  if(P.laps)h+=`<div class="srounds"><div><b id="sessRounds">${+cur.rounds|0}</b><span>/ ${P.laps} pusingan</span><div class="muted" style="font-size:.74rem">Anggaran GPS: ${est} · ${fmtDist(cur.dist)}</div></div>${isteri?`<div class="row"><button class="btn" data-sround="-1" aria-label="Tolak satu pusingan">−1</button><button class="btn pri sbig" data-sround="1">+1 pusingan</button></div>`:''}</div>
  ${(+cur.rounds|0)>=P.laps&&isteri?`<p class="good-note">Lengkap ${P.laps} pusingan. Tekan "Seterusnya" bila mula bahagian baharu.</p>`:''}`;
  if(isteri){const nx=PH[s.cur+1];h+=`<div class="row" style="margin-top:10px;justify-content:space-between">${nx?`<button class="btn pri" id="sNext">Seterusnya: ${nx.n} →</button>`:`<button class="btn pri" id="sEnd2">Selesai umrah</button>`}<button class="btn ghost" id="sEnd">Tamat rakaman</button></div>`}}
 const tot={t:0,d:0};
 h+=`<div class="glbl" style="margin-top:12px">Mengikut bahagian</div><div class="stbl">`+s.phases.map(p=>{const Q=PHK(p.k),t=((+p.t1)||(act?Date.now():(+s.end)||(+p.t0)))-(+p.t0),d=(+p.dist)||0;tot.t+=t;tot.d+=d;
  return `<div class="srow"><span class="sdot" style="background:${Q.c}"></span><span class="sn">${esc(Q.n)}${Q.laps?` <em>(${+p.rounds|0}/${Q.laps})</em>`:''}</span><span>${fmtDur(t)}</span><span>${fmtDist(d)}</span><span>${Math.round(d/STRIDE).toLocaleString('ms-MY')}</span></div>`}).join('')
  +`<div class="srow tot"><span></span><span class="sn">Jumlah</span><span>${fmtDur(tot.t)}</span><span>${fmtDist(tot.d)}</span><span>${Math.round(tot.d/STRIDE).toLocaleString('ms-MY')}</span></div></div><div class="muted" style="font-size:.72rem;margin-top:4px">Lajur: masa · jarak · anggaran langkah</div>`;
 if(+s.gaps)h+=`<p class="sgap">⚠ Rakaman terputus semasa skrin mati atau keluar aplikasi (×${+s.gaps|0})</p>`;
 if(!act&&isteri)h+=`<details class="sfix"><summary>Betulkan jika perlu (selepas ibadah)</summary>${s.phases.map((p,i)=>{const Q=PHK(p.k);return Q.laps?`<div class="row" style="justify-content:space-between;margin-top:8px"><span>${esc(Q.n)}</span><span class="row"><button class="btn" data-sfix="${i}" data-d="-1" aria-label="Tolak">−</button><b>${+p.rounds|0}/${Q.laps}</b><button class="btn" data-sfix="${i}" data-d="1" aria-label="Tambah">+</button></span></div>`:''}).join('')}</details>
  <button class="btn pri" id="sNew" style="margin-top:10px;width:100%">Rakam umrah seterusnya</button>`;
 return h+histHTML();
}

/* --- geofence (anggaran) --- */
const KAABA=[21.422487,39.826206], SAFA=[21.42195,39.82746], MARWAH=[21.42545,39.82742];
const NABAWI=[24.46723,39.61122], QUBA=[24.43926,39.61722], MADINAH=[24.4686,39.6142], JEDDAH=[21.5433,39.1728], JED_AP=[21.6796,39.1565], MED_AP=[24.5534,39.7051];
function meters(a,b){const R=6371000,x=(b[1]-a[1])*Math.PI/180*Math.cos((a[0]+b[0])/2*Math.PI/180),y=(b[0]-a[0])*Math.PI/180;return Math.hypot(x,y)*R}
function segDist(p,a,b){const k=111320,kx=k*Math.cos(p[0]*Math.PI/180);const ax=(a[1]-p[1])*kx,ay=(a[0]-p[0])*k,bx=(b[1]-p[1])*kx,by=(b[0]-p[0])*k;
 const dx=bx-ax,dy=by-ay;let t=-(ax*dx+ay*dy)/(dx*dx+dy*dy);t=Math.max(0,Math.min(1,t));return Math.hypot(ax+t*dx,ay+t*dy)}
function detectZone(lat,lng,acc,speed,info){
 const p=[lat,lng],good=acc<=80,dK=meters(p,KAABA);
 if(dK<=85&&good) return {k:'tawaf',n:'Kawasan Mataf — kemungkinan sedang tawaf'};
 if(segDist(p,SAFA,MARWAH)<=30&&good) return {k:'saie',n:"Kawasan Mas'a — kemungkinan sedang sa'ie"};
 if(info.hotelMkPos&&meters(p,[info.hotelMkPos.lat,info.hotelMkPos.lng])<=60) return {k:'hotel-mk',n:'Di hotel Makkah'+(info.hotelMakkah?' ('+info.hotelMakkah+')':'')};
 if(info.hotelMdPos&&meters(p,[info.hotelMdPos.lat,info.hotelMdPos.lng])<=60) return {k:'hotel-md',n:'Di hotel Madinah'+(info.hotelMadinah?' ('+info.hotelMadinah+')':'')};
 if(dK<=420) return {k:'haram',n:'Di Masjidil Haram'};
 if(meters(p,NABAWI)<=230) return {k:'nabawi',n:'Di Masjid Nabawi'};
 if(meters(p,QUBA)<=150) return {k:'quba',n:'Di Masjid Quba'};
 if(meters(p,JED_AP)<=3500) return {k:'jed-ap',n:'Di Lapangan Terbang Jeddah'};
 if(meters(p,MED_AP)<=2500) return {k:'med-ap',n:'Di Lapangan Terbang Madinah'};
 if(speed!=null&&speed>4) return {k:'jalan',n:'Dalam perjalanan'};
 if(dK<=15000) return {k:'makkah',n:'Di sekitar Makkah'};
 if(meters(p,MADINAH)<=15000) return {k:'madinah',n:'Di sekitar Madinah'};
 if(meters(p,JEDDAH)<=25000) return {k:'jeddah',n:'Di sekitar Jeddah'};
 return {k:'lain',n:'Lokasi lain'};
}

 const note=(document.getElementById('inNote').value||'').trim().slice(0,120);btn.disabled=true;msg.textContent='Menghantar…';
 try{await tripRef.set({manual:{place:sel.place,round:p.round?sel.round:null,note,ts:Date.now()}},{merge:true});msg.textContent='Dihantar.';document.getElementById('inNote').value='';
  if(p.round&&sel.round<7){sel.round++;document.querySelectorAll('[data-round]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.round===sel.round))}}

 navigator.geolocation.getCurrentPosition(p=>{const o={};o['hotel'+which+'Pos']={lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6)};

let TRKS=null;try{TRKS=JSON.parse(localStorage.getItem('umrahTrks')||'null')}catch(e){TRKS=null}

function trksSave(){try{TRKS?localStorage.setItem('umrahTrks',JSON.stringify(TRKS)):localStorage.removeItem('umrahTrks')}catch(e){}}
function trksStart(){const n=Date.now();TRKS={id:'t'+n.toString(36),start:n,until:trackUntil,dist:0,lastPt:null,n:0,places:[],gaps:0,warned:0};trksSave()}
function trksOnStart(resume){if(!resume||!TRKS||TRKS.end){if(TRKS&&!TRKS.end)trksFinish('manual',true);trksStart()}else{TRKS.until=trackUntil;trksSave()}}
function placeLbl(c,z){if(GENZ.includes(z.k)){if(z.k==='jalan')return 'Dalam perjalanan';const a=GEO.addr&&meters([GEO.lat,GEO.lng],[c.latitude,c.longitude])<400?GEO.addr:'';if(a)return a.split(', ').slice(0,2).join(', ');const pl=TRKS&&TRKS.places;if(pl&&pl.length)return pl[pl.length-1].l}return z.n}
function trksFix(c,now,z){
 if(!TRKS||TRKS.end)return;TRKS.n++;
 const lb=placeLbl(c,z),pl=TRKS.places;if(lb&&(!pl.length||pl[pl.length-1].l!==lb)){pl.push({t:now,l:String(lb).slice(0,80)});if(pl.length>40)pl.splice(1,1)}
 if(c.accuracy<=50){const p={lat:c.latitude,lng:c.longitude,ts:now};
  if(TRKS.lastPt){const d=meters([TRKS.lastPt.lat,TRKS.lastPt.lng],[p.lat,p.lng]),dt=Math.max(1,(now-TRKS.lastPt.ts)/1000);
   if(d>=Math.max(8,c.accuracy*0.5)){if(d/dt<=70)TRKS.dist+=d;TRKS.lastPt=p}}else TRKS.lastPt=p}
 TRKS.last=now;if(TRKS.n%3===0)trksSave();
}
function trkSum(t,reason){const end=Math.max(+t.start,Math.min(Date.now(),+t.until||Date.now(),reason==='auto'?(+t.until||Date.now()):Date.now()));
 return {id:t.id,start:+t.start,end,dist:Math.round(+t.dist||0),n:+t.n||0,gaps:+t.gaps||0,reason,places:((p)=>p.length>25?[p[0],...p.slice(-24)]:p)(t.places||[]).map(p=>({t:+p.t||0,l:String(p.l||'')}))}}
function trksFinish(reason,quiet){
 if(!TRKS||TRKS.end)return;
 const sum=trkSum(TRKS,reason);if(sessActive())sessEnd(sum.end);TRKS.end=sum.end;
 S.trkHist=(S.trkHist||[]).filter(x=>x&&x.id!==sum.id).concat([sum]).slice(-60);S.trkLastEnd=sum.end;save();
 if(tripRef)tripRef.set({trkHist:firebase.firestore.FieldValue.arrayUnion(sum)},{merge:true}).catch(()=>{});
 TRKS=null;trksSave();
 if(!quiet&&(current==='utama'||current==='lokasi'))setTimeout(render,60);
}

 return `<div class="bsum"><div><div class="glbl">Dibelanjakan</div><div class="bbig">SAR ${f2(t.all)}</div><div class="muted" style="font-size:.85rem">≈ RM ${f2(t.all*b.rate)}</div></div>
 <div style="text-align:right"><div class="glbl">Baki bajet</div><div class="bbig ${left<0?'neg':''}">SAR ${f2(left)}</div><div class="muted" style="font-size:.85rem">daripada SAR ${f2(b.limit)}</div></div></div>
 <div class="prog" style="margin-top:10px"><div class="bar"><i style="width:${p}%;${warn?'background:var(--warn)':''}"></i></div><span class="pct">${Math.round(p)}%</span></div>
 ${left<0?`<p style="margin:8px 0 0;color:var(--warn);font-size:.85rem">Perbelanjaan melebihi bajet sebanyak SAR ${f2(-left)}.</p>`:warn?`<p style="margin:8px 0 0;color:var(--warn);font-size:.85rem">Sudah guna lebih 80% bajet.</p>`:''}`}
function bCatsHTML(){const t=bTotals();const rows=BCATS.filter(c=>t.cat[c[0]]).sort((a,b)=>t.cat[b[0]]-t.cat[a[0]]);
 if(!rows.length)return `<p class="muted" style="margin:0">Belum ada perbelanjaan.</p>`;const max=Math.max(...rows.map(c=>t.cat[c[0]]));
 return rows.map(c=>`<div class="bcat"><span>${c[1]}</span><div class="bar"><i style="width:${t.cat[c[0]]/max*100}%"></i></div><b>SAR ${f2(t.cat[c[0]])}</b></div>`).join('')}

 const t=bTotals();const days=[...new Set(b.items.map(i=>i.day))].sort().reverse();

  const ti=TRIP.findIndex(x=>x.d===d);
  return `<div class="bday"><div class="bdh"><b>${lbl}${ti>=0?' · Hari '+(ti+1):''}</b><span>SAR ${f2(t.day[d])}</span></div>`+

/* ---------- gambar → Google Drive (melalui Google Apps Script) ---------- */
const GCATS=[['kenangan','Kenangan'],['resit','Resit'],['dokumen','Dokumen']];
let gsel={cat:'kenangan'}, gfilter='semua', GITEMS=null, GERR='', GQ=[];
function UP(){const i=(typeof INFO==='function'?INFO():{})||{};const okU=u=>typeof u==='string'&&/^https:\/\/script\.google\.com\//.test(u);return {url:(okU(i.uploadUrl)?i.uploadUrl:'')||(okU(lsGet('upUrl'))?lsGet('upUrl'):''),token:String(i.uploadToken||lsGet('upTok')||'')}}
function gThumb(id){return 'https://drive.google.com/thumbnail?id='+encodeURIComponent(id)+'&sz=w480'}
function gView(id){return 'https://drive.google.com/file/d/'+encodeURIComponent(id)+'/view'}
function compressImg(file){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);
 img.onload=()=>{const max=1600;let w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(u);
  const d=c.toDataURL('image/jpeg',0.82);res({data:d.split(',')[1],preview:c.toDataURL('image/jpeg',0.4)})};
 img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('Fail bukan gambar'))};img.src=u})}
async function gLoad(){const up=UP();if(!up.url||!up.token){GITEMS=null;gRender();return}
 GERR='';try{const r=await fetch(up.url+(up.url.includes('?')?'&':'?')+'action=list&token='+encodeURIComponent(up.token));const j=await r.json();
  if(!j.ok)throw new Error(j.error||'Gagal');GITEMS=j.items||[]}catch(e){GERR='Tidak dapat memuatkan galeri: '+(e.message||e)}gRender()}
async function gUpload(q){if(q.busy||q.st==='ok')return;q.busy=true;try{await gUpload_(q)}finally{q.busy=false}}
async function gUpload_(q){const up=UP();q.st='Memampatkan…';gRender();
 try{if(!q.data){const c=await compressImg(q.file);q.data=c.data;q.preview=c.preview}
  if(!q.id){q.id=Date.now().toString(36)+Math.random().toString(36).slice(2,7);IDB.put('uploads',{id:q.id,name:q.name,caption:q.caption,cat:q.cat,ts:q.ts,day:q.day,data:q.data,preview:q.preview}).catch(()=>{})}
  q.st='Memuat naik…';gRender();
  const r=await fetch(up.url,{method:'POST',body:JSON.stringify({token:up.token,data:q.data,mime:'image/jpeg',name:q.name,caption:q.caption,cat:q.cat,ts:q.ts,day:q.day})});
  const j=await r.json();if(!j.ok)throw new Error(j.error||'Gagal');q.st='ok';q.data=null;if(q.id)IDB.del('uploads',q.id).catch(()=>{});gRender();
 }catch(e){q.st='fail';q.err=navigator.onLine?(e.message||'Gagal'):'Tiada internet';gRender()}}
function gQueueHTML(){if(!GQ.length)return '';return `<div class="gq">`+GQ.map((q,i)=>`<div class="gqi">${q.preview?`<img src="${q.preview}" alt="">`:'<div class="gph"></div>'}<div style="min-width:0"><b>${esc(q.caption||q.name)}</b><div class="muted" style="font-size:.78rem">${q.st==='ok'?'<span style="color:var(--sage)">Berjaya disimpan ke Drive</span>':q.st==='fail'?`<span style="color:var(--warn)">${esc(q.err)}</span>`:q.st}</div></div>${q.st==='fail'?`<button class="btn" data-gretry="${i}">Cuba lagi</button>`:''}</div>`).join('')+`</div>`}
function gGalleryHTML(){const up=UP();
 if(!up.url||!up.token)return `<p class="muted" style="margin:0">Galeri akan muncul selepas tetapan Google Drive disimpan.</p>`;
 if(GERR)return `<p style="margin:0;color:var(--warn)">${esc(GERR)}</p>`;
 if(GITEMS===null)return `<p class="muted" style="margin:0">Memuatkan galeri…</p>`;
 const items=GITEMS.filter(i=>gfilter==='semua'||i.cat===gfilter);
 if(!items.length)return `<p class="muted" style="margin:0">Belum ada gambar${gfilter!=='semua'?' dalam kategori ini':''}.</p>`;
 return `<div class="ggrid">`+items.map(i=>`<a class="gcell" href="${gView(i.id)}" target="_blank" rel="noopener"><img loading="lazy" src="${gThumb(i.id)}" alt="${esc(i.caption||i.name)}"><span>${esc(i.caption||(GCATS.find(c=>c[0]===i.cat)||[0,''])[1])}<em>${fmtAt(i.ts,'Asia/Riyadh')} · ${esc(i.day)}</em></span></a>`).join('')+`</div>`}
function gRender(){const a=document.getElementById('gQueue');if(a)a.innerHTML=gQueueHTML();const b=document.getElementById('gGallery');if(b)b.innerHTML=gGalleryHTML()}
function gambarView(){const up=UP();
 return `<div><h2>Gambar & resit</h2><p class="lead">Ambil atau pilih gambar dari telefon; gambar dimampatkan dan disimpan terus ke folder Google Drive "Umrah Isteri 2026", disusun mengikut tarikh. Suami boleh lihat galeri yang sama dari Malaysia.</p></div>
 <div class="panel"><h3>Muat naik gambar</h3>
  <label class="gpick ${up.url&&up.token?'':'off'}" for="gFile" id="gPick"><b>${up.url&&up.token?'Pilih atau ambil gambar':'Isi tetapan Google Drive dahulu'}</b><span>${up.url&&up.token?'Boleh pilih beberapa gambar sekali gus':'Tekan di sini untuk pergi ke tetapan'}</span>${up.url&&up.token?'<input type="file" id="gFile" class="gfile" accept="image/*" multiple aria-label="Pilih gambar">':''}</label>
  <p class="muted" id="gPickMsg" style="font-size:.82rem;margin:8px 0 0" aria-live="polite"></p>
  <div class="glbl" style="margin-top:10px">Kategori</div><div class="chips">${GCATS.map(c=>`<button class="chip" data-gcat="${c[0]}" aria-pressed="${gsel.cat===c[0]}">${c[1]}</button>`).join('')}</div>
  <label class="glbl" for="gCap" style="display:block;margin-top:10px">Keterangan (pilihan)</label><input type="text" id="gCap" class="txt" maxlength="120" placeholder="cth: Selepas umrah pertama, depan Kaabah">
  <div id="gQueue">${gQueueHTML()}</div></div>
 <div class="panel"><div class="row" style="justify-content:space-between;margin-bottom:8px"><h3 style="margin:0">Galeri</h3><button class="btn" id="gReload">Muat semula</button></div>
  <div class="chips" style="margin-bottom:10px">${[['semua','Semua'],...GCATS].map(c=>`<button class="chip" data-gfil="${c[0]}" aria-pressed="${gfilter===c[0]}">${c[1]}</button>`).join('')}</div>
  <div id="gGallery">${gGalleryHTML()}</div></div>
 <div class="panel"><h3>Tetapan Google Drive (sekali sahaja)</h3><div class="form">
  <label for="gUrl">URL Web App Google Apps Script</label><input type="url" id="gUrl" class="txt" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(up.url)}">
  <label for="gTok">Kod rahsia (sama seperti SECRET dalam skrip)</label><input type="text" id="gTok" class="txt" value="${esc(up.token)}" autocomplete="off"></div>
  <div class="row" style="margin-top:10px;justify-content:space-between"><span class="muted" id="gMsg" style="font-size:.82rem"></span><button class="btn pri" id="gSave">Simpan tetapan</button></div>
  <p class="muted" style="font-size:.78rem;margin:8px 0 0">Tetapan ini dikongsi melalui pautan keluarga, jadi cukup diisi pada satu telefon.</p></div>
 <div class="panel soft"><h3>Perlu tahu</h3><ul class="plist" style="margin:0"><li>Gambar dikecilkan kepada 1600 piksel untuk jimat data roaming.</li><li>Setiap gambar dikongsi "sesiapa yang ada pautan" supaya boleh dipaparkan dalam galeri. Jangan muat naik gambar pasport atau dokumen sulit.</li><li>Jika gagal kerana tiada internet, tekan "Cuba lagi" bila talian pulih.</li></ul></div>`}
main.addEventListener('change',e=>{const t=e.target;if(t.id!=='gFile')return;const up=UP();
 const pm=document.getElementById('gPickMsg');
 if(!up.url||!up.token){if(pm)pm.textContent='Isi tetapan Google Drive dahulu.';t.value='';return}
 if(!t.files||!t.files.length){if(pm)pm.textContent='Tiada gambar dipilih.';return}
 if(pm)pm.textContent=t.files.length+' gambar dipilih — sedang dimuat naik…';
 const cap=(document.getElementById('gCap').value||'').trim();
 Array.from(t.files||[]).forEach((f,i)=>{const q={file:f,name:`${saKey()}_${gsel.cat}_${Date.now()}_${i}.jpg`,caption:cap,cat:gsel.cat,ts:Date.now(),day:saKey(),st:'Menunggu…'};GQ.unshift(q)});
 t.value='';document.getElementById('gCap').value='';gRender();
 (async()=>{for(const q of GQ.filter(q=>q.st==='Menunggu…'))await gUpload(q);gLoad()})();
});
main.addEventListener('click',e=>{const t=e.target;
 const c=t.closest('[data-gcat]');if(c){gsel.cat=c.dataset.gcat;document.querySelectorAll('[data-gcat]').forEach(x=>x.setAttribute('aria-pressed',x===c));return}
 const f=t.closest('[data-gfil]');if(f){gfilter=f.dataset.gfil;document.querySelectorAll('[data-gfil]').forEach(x=>x.setAttribute('aria-pressed',x===f));gRender();return}
 const r=t.closest('[data-gretry]');if(r){const q=GQ[+r.dataset.gretry];if(q)gUpload(q).then(gLoad);return}
 const gp=t.closest('#gPick');if(gp&&gp.classList.contains('off')){e.preventDefault();const u=document.getElementById('gUrl');if(u){u.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(()=>u.focus(),400)}return}
 if(t.closest('#gReload')){GITEMS=null;gRender();gLoad();return}
 if(t.closest('#gSave')){const url=document.getElementById('gUrl').value.trim(),tok=document.getElementById('gTok').value.trim(),m=document.getElementById('gMsg');
  if(!/^https:\/\/script\.google\.com\//.test(url)){m.textContent='URL mesti bermula dengan https://script.google.com/';return}
  if(tok.length<8){m.textContent='Kod rahsia sekurang-kurangnya 8 aksara.';return}
  lsSet('upUrl',url);lsSet('upTok',tok);
  const done=()=>{GITEMS=null;GERR='';render()};
  if(typeof tripRef!=='undefined'&&tripRef)tripRef.set({info:{uploadUrl:url,uploadToken:tok}},{merge:true}).then(done).catch(()=>{m.textContent='Disimpan dalam telefon ini sahaja.';gLoad()});else done();return}
});

/* ---------- ringkasan umrah (dashboard) ---------- */
let RS_MODE=null, RS_BUSY=false;
const ZONE_LBL={tawaf:'Kawasan Mataf (tawaf)',saie:"Kawasan Mas'a (sa'ie)",haram:'Masjidil Haram',nabawi:'Masjid Nabawi',raudhah:'Raudhah',quba:'Masjid Quba','hotel-mk':'Hotel Makkah','hotel-md':'Hotel Madinah',miqat:'Miqat',ziarah:'Ziarah luar','jed-ap':'Lapangan Terbang Jeddah','med-ap':'Lapangan Terbang Madinah'};
function rsDays(mode){if(mode==='umrah')return TRIP.map(t=>t.d);const ks=Object.keys(S.daily||{}).filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k));return [...new Set(ks.concat(TRIP.map(t=>t.d)))].sort()}
function rsDayStats(k){const d=(S.daily&&S.daily[k])||{checks:{},counts:{}},c=d.counts||{},ch=d.checks||{};const has=p=>Object.keys(ch).some(x=>x.startsWith(p+'-'));
 const n=p=>Object.keys(ch).filter(x=>x.startsWith(p+'-')).length;
 return {selawat:c.selawat||0,istighfar:c.istighfar||0,tasbih:(c.tasbih||0)+(c.tahmid||0)+(c.takbir||0),tahlil:(c.tahlil||0)+(c.wabihamdihi||0)+(c.hauqalah||0),
  tahajjud:!!ch['malam-2'],malam:has('malam'),dhuha:!!ch['dhuha-0'],pagi:n('pagi'),petang:n('petang'),wirid:n('wirid'),doa:n('doa'),jumaat:n('jumaat'),checks:Object.keys(ch).length}}
async function rsPlaces(days){const out={};
 try{if(typeof tripRef!=='undefined'&&tripRef){await Promise.all(days.map(async d=>{const s=await Promise.race([tripRef.collection('days').doc(d).get(),new Promise((_,rj)=>setTimeout(()=>rj(new Error('t')),4000))]).catch(()=>null);const pts=(s&&s.exists&&s.data().pts)||[];const seq=[];pts.forEach(p=>{if(!seq.length||seq[seq.length-1]!==p.zone)seq.push(p.zone)});out[d]=seq}));return {src:'GPS auto',out}}}catch(e){}
 try{if(typeof DB!=='undefined'&&DB){await Promise.all(days.map(async d=>{const s=await DB.doc('log/'+d).get();const it=(s.exists&&s.data().items)||[];const seq=[];it.forEach(p=>{if(!seq.length||seq[seq.length-1]!==p.place)seq.push(p.place)});out[d]=seq}));return {src:'status dikongsi',out}}}catch(e){}
 return {src:'',out}}
function rsChecklist(k){const {t,c}=count(k);return {t,c,p:t?Math.round(c/t*100):0}}
function rsMissed(k){const res=[];DATA[k].groups.forEach((g,gi)=>g.items.forEach((it,ii)=>{if(!S.checks[`${k}-${gi}-${ii}`])res.push(it[0])}));return res}
function rsTile(v,l,s){return `<div class="rtile"><b>${v}</b><span>${l}</span>${s?`<em>${s}</em>`:''}</div>`}
function rsBar(l,p,x){return `<div class="rbar"><span>${l}</span><div class="bar"><i style="width:${p}%"></i></div><b>${x}</b></div>`}
async function rsBuild(){if(RS_BUSY)return;RS_BUSY=true;try{await rsBuild_()}catch(e){const o=document.getElementById('rsOut');if(o)o.innerHTML='<p class="muted" style="margin:0">Ringkasan gagal dijana. Tekan "Jana ringkasan" sekali lagi.</p>'}finally{RS_BUSY=false}}
async function rsBuild_(){

async function wxLoad(){
 try{const url='https://api.open-meteo.com/v1/forecast?latitude=21.4225,24.4672&longitude=39.8262,39.6111&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code&daily=temperature_2m_max,temperature_2m_min,uv_index_max&timezone=Asia%2FRiyadh&forecast_days=1';
  const r=await fetch(url);if(!r.ok)throw new Error(r.status);const j=await r.json();const arr=Array.isArray(j)?j:[j];if(arr.length<2||!arr.every(x=>x&&x.current&&x.daily))throw new Error('data');
  wxFail=false;WX={ts:Date.now(),d:arr.map(x=>({t:x.current.temperature_2m,f:x.current.apparent_temperature,h:x.current.relative_humidity_2m,c:x.current.weather_code,mx:x.daily.temperature_2m_max[0],mn:x.daily.temperature_2m_min[0],uv:x.daily.uv_index_max?x.daily.uv_index_max[0]:null}))};

async function pwaCheck(){if((location.protocol!=='https:'&&location.hostname!=='localhost')||PWA_MISSING!==null)return;const need=['manifest.webmanifest','sw.js','icon-192.png','icon-512.png','icon-maskable-512.png','apple-touch-icon.png'];const miss=[];
 await Promise.all(need.map(async n=>{try{const r=await fetch(n+'?c='+Date.now(),{cache:'no-store'});if(!r.ok)miss.push(n)}catch(e){}}));PWA_MISSING=miss;pwaRender()}
function pwaPanel(){if(isStandalone())return '';
 const ios=isIOS();
 return `<div class="panel pwa"><div class="pwa-row"><img src="${APP_ICON}" alt="" width="48" height="48"><div style="min-width:0"><h3 style="margin:0 0 2px">Pasang sebagai aplikasi</h3><p class="muted" style="margin:0;font-size:.84rem">Buka terus dari skrin utama, skrin penuh, dan masih boleh dibaca tanpa internet.</p></div></div>
 ${PWA_PROMPT?`<button class="btn pri" id="pwaInstall" style="width:100%;margin-top:10px">Pasang aplikasi</button>`:ios?`<ol class="ol" style="margin:10px 0 0"><li>Buka halaman ini dalam <b>Safari</b>.</li><li>Tekan butang <b>Share</b> (kotak dengan anak panah ke atas).</li><li>Pilih <b>Add to Home Screen</b> → <b>Add</b>.</li></ol>`:`<ol class="ol" style="margin:10px 0 0"><li>Tekan menu <b>⋮</b> di Chrome.</li><li>Pilih <b>Install app</b> atau <b>Add to Home screen</b>.</li></ol>`}
 ${PWA_MISSING&&PWA_MISSING.length?`<div class="pwa-miss"><b>Aplikasi belum boleh dipasang.</b> Fail ini belum ada di GitHub: ${PWA_MISSING.map(n=>'<code>'+n+'</code>').join(', ')}. Muat naik semua fail dalam folder <code>github/</code> dari zip, kemudian muat semula halaman.</div>`:''}
 <p class="muted" style="font-size:.76rem;margin:8px 0 0">${ios?'Pada iPhone, aplikasi yang dipasang menyimpan rekod berasingan daripada Safari. Pasang dahulu, kemudian guna aplikasi itu sahaja (atau pindahkan dengan Sandaran di tab Ringkasan).':'Pasang dari pautan keluarga supaya lokasi terus bersambung.'}</p></div>`}
function pwaRender(){const b=document.getElementById('pwaBox');if(b)b.innerHTML=pwaPanel()}

/* --- sandaran (export / import) --- */
function backupDownload(){try{const blob=new Blob([JSON.stringify({app:'umrah-isteri',v:1,at:Date.now(),trip:(typeof TRIPID!=='undefined'?TRIPID:''),state:S},null,1)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sandaran-umrah-'+todayKey()+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);return true}catch(e){return false}}
function backupRestore(file,msg){const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j||j.app!=='umrah-isteri'||!j.state)throw new Error('bukan fail sandaran');
  S=Object.assign({checks:{},depart:'',city:'makkah',daily:{}},j.state);save();
  if(j.trip&&typeof TRIPID!=='undefined'&&!TRIPID){TRIPID=j.trip;lsSet('umrahTrip',TRIPID);try{history.replaceState(null,'',familyLink())}catch(e){}connect()}
  msg.textContent='Sandaran dipulihkan.';render()}catch(e){msg.textContent='Fail tidak sah: '+e.message}};r.readAsText(file)}

/* --- sertai perjalanan dengan menampal pautan keluarga --- */
function joinTrip(v){v=(v||'').trim();let id='';try{id=new URL(v).searchParams.get('trip')||''}catch(e){}if(!id&&/^[a-z0-9]{20,40}$/i.test(v))id=v;return id}

main.addEventListener('click',e=>{const t=e.target;
 if(t.closest('#pwaInstall')&&PWA_PROMPT){PWA_PROMPT.prompt();PWA_PROMPT.userChoice.finally(()=>{PWA_PROMPT=null;pwaRender()});return}
 if(t.closest('#bkDown')){const m=document.getElementById('bkMsg');m.textContent=backupDownload()?'Fail sandaran dimuat turun.':'Tidak dapat memuat turun.';return}
 if(t.closest('#tripJoin')){const v=document.getElementById('tripPaste').value,m=document.getElementById('tripMsg'),id=joinTrip(v);
  if(!id){m.textContent='Pautan tidak sah. Tampal pautan keluarga penuh (yang ada ?trip=).';return}
  TRIPID=id;lsSet('umrahTrip',TRIPID);try{history.replaceState(null,'',familyLink())}catch(e){}connect();render();return}
});
main.addEventListener('change',e=>{if(e.target.id==='bkFile'&&e.target.files&&e.target.files[0]){backupRestore(e.target.files[0],document.getElementById('bkMsg'));e.target.value=''}});

/* --- baris gilir muat naik gambar disimpan dalam IndexedDB --- */
function gRetryAll(){const up=UP();if(!up.url||!up.token||!navigator.onLine)return;const list=GQ.filter(q=>q.st==='fail');if(!list.length)return;
 (async()=>{for(const q of list)await gUpload(q);gLoad()})()}
IDB.all('uploads').then(list=>{if(!list||!list.length)return;list.sort((a,b)=>b.ts-a.ts).forEach(u=>{if(!GQ.some(q=>q.id===u.id))GQ.push(Object.assign({},u,{st:'fail',err:'Belum dihantar — akan dihantar bila ada talian'}))});gRender();setTimeout(gRetryAll,2000)}).catch(()=>{});
window.addEventListener('online',()=>{gRetryAll();if(typeof wxLoad==='function')wxLoad()});

/* --- muat keadaan dari IndexedDB (jika lebih baharu daripada localStorage) --- */
IDB.get('state').then(v=>{if(v&&(!LS_HAD||(v.savedAt||0)>LS_SAVED_AT)){S=Object.assign(S,v);save();render()}else if(!v){IDB.set('state',JSON.parse(JSON.stringify(S))).catch(()=>{})}}).catch(()=>{});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

/* --- service worker --- */
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){const reg=()=>navigator.serviceWorker.register('./sw.js').catch(()=>{});if(document.readyState==='complete')reg();else window.addEventListener('load',reg)}

/* ---------- render & events ---------- */
function render(){
 const v=current==='utama'?utamaView():current==='doa'?doaView():current==='berkat'?berkatView():current==='zikir'?zikirView():current==='lokasi'?lokasiView():current==='penjejak'?penjejakView():current==='jadual'?jadualView():current==='bajet'?bajetView():current==='ringkasan'?ringkasanView():current==='gambar'?gambarView():listView(current);
 main.innerHTML=`<section class="view" role="tabpanel" aria-labelledby="tab-${current}">${v}</section><p class="foot">Panduan umum mazhab Syafie. Ikut arahan mutawwif & syarat terkini kerajaan Saudi.</p>`;
 if(current==='utama') liveUpdate();
 updateCounts();fillInfo();if(current==='ringkasan')rsBuild();afterRender();
}
function go(k){current=k;try{history.replaceState(null,'','#'+k)}catch(_){}drawTabs();render();window.scrollTo({top:0});
 tabScroll();}
function tabScroll(){const b=document.getElementById('tab-'+current);if(!b)return;const L=b.offsetLeft-tabsEl.offsetLeft-(tabsEl.clientWidth-b.offsetWidth)/2;try{tabsEl.scrollTo({left:Math.max(0,L)})}catch(e){tabsEl.scrollLeft=Math.max(0,L)}}
function buzz(){try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}}
function arm(btn,fn){if(btn.dataset.armed){delete btn.dataset.armed;btn.textContent=btn.dataset.label;fn();return}
 btn.dataset.armed='1';btn.dataset.label=btn.textContent;btn.textContent='Tekan sekali lagi untuk sahkan';
 setTimeout(()=>{if(btn.isConnected&&btn.dataset.armed){delete btn.dataset.armed;btn.textContent=btn.dataset.label}},3500);}
main.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset.day){const d=day(t.dataset.day);if(t.checked)d.checks[t.dataset.id]=1;else delete d.checks[t.dataset.id];save();
  const p=document.getElementById('dp-'+t.dataset.grp);if(p)p.outerHTML=dailyProg(t.dataset.grp,p.dataset.key,+p.dataset.n);return;}
 if(t.dataset.id){if(t.checked)S.checks[t.dataset.id]=true;else delete S.checks[t.dataset.id];save();const k=t.dataset.id.split('-')[0];const pg=document.getElementById('pg-'+k);if(pg)pg.innerHTML=progHTML(k);return;}
 if(t.id==='depart'){S.depart=t.value;save();liveUpdate();}
});
main.addEventListener('click',e=>{
 const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return;}
 const c=e.target.closest('[data-city]');if(c){S.city=c.dataset.city;save();render();return;}
 const a=e.target.closest('[data-act]');
 if(a){const z=a.dataset.z,d=day(todayKey());
  if(a.dataset.act==='inc'){d.counts[z]=Math.max(0,(d.counts[z]||0)+Number(a.dataset.n));save();updateCounts();buzz();}
  else if(a.dataset.act==='reset'){arm(a,()=>{d.counts[z]=0;save();updateCounts();});}
  return;}
 const r=e.target.closest('.reset');if(r){arm(r,()=>{const k=r.id.slice(6);Object.keys(S.checks).forEach(id=>{if(id.startsWith(k+'-'))delete S.checks[id]});save();render();});}
});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h)&&h!==current){go(h)}});
let lastDay=todayKey();
setInterval(()=>{if(todayKey()!==lastDay){lastDay=todayKey();render()}},30000);
prune();save();
drawTabs();render();tick();setTimeout(tabScroll,50);setInterval(tick,1000);setInterval(tickAgo,30000);
</script>

const IDB={p:null,
 open(){if(this.p)return this.p;this.p=new Promise((res,rej)=>{if(!window.indexedDB)return rej("noidb");const r=indexedDB.open("simulasi-umrah",1);
   r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains("kv"))d.createObjectStore("kv");if(!d.objectStoreNames.contains("audio"))d.createObjectStore("audio");};

 tx(st,mode,fn){return this.open().then(d=>new Promise((res,rej)=>{const t=d.transaction(st,mode),q=fn(t.objectStore(st));t.oncomplete=()=>res(q?q.result:undefined);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);}));},
 get(st,k){return this.tx(st,"readonly",s=>s.get(k));},put(st,k,v){return this.tx(st,"readwrite",s=>s.put(v,k));},
 del(st,k){return this.tx(st,"readwrite",s=>s.delete(k));},keys(st){return this.tx(st,"readonly",s=>s.getAllKeys());}};

function qUrl(n,r){r=r||qQari();return r.s+String(n).padStart(3,"0")+".mp3";}
const qOffKeys=new Set(),qBlobUrls={};
IDB.keys("audio").then(ks=>{(ks||[]).forEach(k=>qOffKeys.add(k));}).catch(()=>{});
function qKey(n){return qQari().id+"/"+n;}
function qResolve(n){const k=qKey(n);if(qBlobUrls[k])return Promise.resolve(qBlobUrls[k]);
  return IDB.get("audio",k).then(b=>{if(b){qBlobUrls[k]=URL.createObjectURL(b);return qBlobUrls[k];}return qUrl(n);}).catch(()=>qUrl(n));}
function qSrc(n){return qUrl(n);}
function qDownload(n){const k=qKey(n);return fetch(qUrl(n),{mode:"cors"}).then(r=>{if(!r.ok)throw new Error("http");return r.blob();})
  .then(b=>IDB.put("audio",k,b)).then(()=>{qOffKeys.add(k);});}
function qRemoveOff(n){const k=qKey(n);if(qBlobUrls[k]){URL.revokeObjectURL(qBlobUrls[k]);delete qBlobUrls[k];}return IDB.del("audio",k).then(()=>qOffKeys.delete(k));}

/* player: HTML audio for files, Web Audio for embedded data (works where media URLs are blocked) */
const qa=new Audio();qa.preload="none";let qList=[],qIdx=0,qOn=false,qLoop=false,qHeld=false,qCb=null,qGen=0;
let qCtx=null,qNode=null,qBufs={},qStartAt=0,qOff=0,qWA=false;
function qUseWA(n){return false;}
function qCtxInit(){try{if(!qCtx){const C=window.AudioContext||window.webkitAudioContext;if(C)qCtx=new C();}if(qCtx&&qCtx.state==="suspended")qCtx.resume();}catch(e){}}
function qBuf(n){if(qBufs[n])return Promise.resolve(qBufs[n]);const b=atob(AUD_DATA[n].split(",")[1]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
  return new Promise((res,rej)=>qCtx.decodeAudioData(u.buffer,x=>{qBufs[n]=x;res(x);},rej));}
function qWAStop(){if(qNode){qNode.onended=null;try{qNode.stop();}catch(e){}qNode=null;}}
function qWAStart(){const n=qList[qIdx],g=qGen;qBuf(n).then(buf=>{if(g!==qGen||!qOn||qHeld)return;qWAStop();const src=qCtx.createBufferSource();src.buffer=buf;src.connect(qCtx.destination);
  if(qOff>=buf.duration)qOff=0;src.onended=()=>{if(qNode!==src)return;qNode=null;qOff=0;qEnded();};qStartAt=qCtx.currentTime;src.start(0,qOff);qNode=src;}).catch(()=>qFail());}
function qEnded(){const n=qList[qIdx];if(qCb)qCb(n);qIdx++;qGo();}
function qFail(){if(!qOn)return;const o=document.getElementById("qmsg");if(o)o.textContent=qt().na;if(typeof flash==="function"&&$("bar")&&$("bar").style.display!=="none")flash(qt().na);qOn=false;qUI();if(typeof buildBar==="function")try{buildBar();}catch(e){}}
function qPlay(list,loop,cb){qCtxInit();qStop(true);qList=list.slice();qIdx=0;qOn=true;qLoop=!!loop;qCb=cb||null;qHeld=false;qGo();}
function qGo(){if(!qOn)return;if(qIdx>=qList.length){if(qLoop&&qList.length)qIdx=0;else{qOn=false;qUI();return;}}
  const n=qList[qIdx];qGen++;qOff=0;qWA=qUseWA(n);
  if(qWA&&qCtx){try{qa.pause();}catch(e){}if(!qHeld)qWAStart();}
  else{qWAStop();const k=qKey(n),g=qGen,go=u=>{if(g!==qGen||!qOn)return;qa.src=u;qa.volume=1;if(!qHeld)qa.play().catch(e=>{if(e&&e.name==="NotAllowedError")return;qErr();});};
    if(qOffKeys.has(k))qResolve(n).then(go);else go(qUrl(n));}
  qUI();}
qa.onended=()=>{if(!qWA)qEnded();};
let qErrN=0;function qErr(){qErrN++;if(qErrN>=3||qList.length<=1){qErrN=0;qFail();}else{qIdx++;qGo();}}
qa.addEventListener("playing",()=>{qErrN=0;});
qa.onerror=()=>{if(qOn&&!qWA)qErr();};
function qStop(silent){qOn=false;qHeld=false;qGen++;qWAStop();qOff=0;try{qa.pause();}catch(e){}if(!silent)qUI();}
function qHold(h){if(h===qHeld)return;qHeld=h;if(!qOn)return;
  if(qWA){if(h){if(qNode&&qCtx){qOff+=qCtx.currentTime-qStartAt;qWAStop();}}else qWAStart();}
  else{try{if(h)qa.pause();else qa.play().catch(()=>{});}catch(e){}}}
function qUnlock(){qCtxInit();try{if(!window.AUD_DATA){qa.src=qSrc(112);qa.muted=true;qa.play().then(()=>{qa.pause();qa.muted=false;qa.currentTime=0;}).catch(()=>{qa.muted=false;});}}catch(e){}}
function qUI(){document.querySelectorAll("[data-q]").forEach(b=>{const on=qOn&&qList[qIdx]===+b.dataset.q&&qList.length===1;b.textContent=on?qt().stop:qt().play;b.setAttribute("aria-pressed",on);});
  const a=document.getElementById("qall");if(a)a.textContent=(qOn&&qList.length>1)?qt().stop:qt().all;const qb=document.getElementById("qbtn");if(qb){qb.setAttribute("aria-pressed",qOn&&qLoop);}}
function qToggleOne(n,cb){if(qOn&&qList.length===1&&qList[0]===n){qStop();return;}qPlay([n],false,cb);}

let vTok=0;
function vSpeak(parts,force){if(!window.speechSynthesis||(!VO.on&&!force))return;try{speechSynthesis.cancel();const tok=++vTok,ps=parts.filter(p=>p&&p.t),canTalk=speechSynthesis.getVoices().length>0;if(ps.length&&canTalk)qHold(true);
  ps.forEach((p,i)=>{const code=p.ar?"ar-SA":(VLANG[lang]||"ms-MY"),u=new SpeechSynthesisUtterance(p.t);u.lang=code;const v=vPick(code);if(v)u.voice=v;u.rate=p.ar?0.8:0.95;
    if(i===ps.length-1)u.onend=u.onerror=()=>{if(tok===vTok)qHold(false);};speechSynthesis.speak(u);});
  const ms=Math.min(30000,2500+ps.reduce((a,p)=>a+p.t.length,0)*95);setTimeout(()=>{if(tok===vTok&&qHeld)qHold(false);},ms);}catch(e){qHold(false);}}

let pjLastPush=0;
function pjPush(force){const r=famRef();if(!r||!isWife()||!TS)return;const n=Date.now();if(!force&&n-pjLastPush<30000)return;pjLastPush=n;const sum=pjSum(TS);
  const o={pj:sum};if(TS.done&&typeof firebase!=="undefined")o.pjHist=firebase.firestore.FieldValue.arrayUnion(sum);r.set(o,{merge:true}).catch(()=>{});}
function pjFamStart(){try{if(isWife()&&famRef()&&typeof tracking==="function"&&!tracking()&&typeof startTracking==="function")startTracking(false);}catch(e){}}
const esc=t=>String(t==null?"":t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hhmm=ms=>{try{return new Intl.DateTimeFormat("ms-MY",{timeZone:"Asia/Riyadh",hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date(ms));}catch(e){return "";}};
function pjRow(x,T){const dd=new Date(x.start);return `<details class="place khist"><summary><b>${dd.toLocaleDateString("ms-MY")}</b> · ${fmtD(+x.dist||0)} · ${(+x.steps||0).toLocaleString()} ${T.steps.toLowerCase()} · ${fmtT(+x.el||0)}</summary>
  ${x.hname?`<p class="pmeta">🏨 ${esc(x.hname)}</p>`:""}<p class="pmeta">Mula ${hhmm(x.start)}${x.end?" · tamat "+hhmm(x.end):""} (waktu Saudi)${x.auto?" · "+T.auto:""}</p>
  <table class="ktab">${T.seg.map((n,i)=>`<tr><td>${n}${i===1?` <small>(${+x.laps||0}/7)</small>`:i===2?` <small>(${+x.legs||0}/7)</small>`:""}</td><td>${fmtT((x.segT||[])[i]||0)}</td><td>${fmtD((x.segD||[])[i]||0)}</td></tr>`).join("")}</table></details>`;}
function pjFamHTML(){const T=KT.bm,box=$("pjFam");if(!box)return;
  if(isWife()){box.innerHTML=famRef()?`<p class="kfamnote">💞 Kemajuan dan ringkasan penjejak dihantar kepada suami secara automatik. Lokasi keluarga juga dihidupkan apabila anda tekan <b>Setuju &amp; mula</b>.</p>`:`<p class="kfamnote">Untuk kongsi dengan suami, sediakan pautan keluarga di tab <a href="#lokasi" data-go="lokasi">Lokasi</a> dahulu.</p>`;return;}
  const doc=(typeof LIVE!=="undefined"&&LIVE.doc)||{},p=doc.pj,H=Array.isArray(doc.pjHist)?doc.pjHist.slice().sort((a,b)=>(b.start||0)-(a.start||0)).slice(0,15):[];
  let h=`<div class="panel kfam"><h3 style="margin:0 0 6px">Penjejak isteri</h3>`;
  if(!famRef())h+=`<p class="muted">Buka pautan keluarga dan pilih <b>Suami</b> di tab Lokasi untuk melihat penjejak isteri.</p>`;
  else if(p&&!p.done){const stale=Date.now()-(+p.ts||0)>180000,el=(+p.el||0)+(p.paused||stale?0:Date.now()-(+p.ts||0));
    h+=`<p class="pmeta">${p.paused?"⏸ Dijeda":"● Sedang merakam"} · dikemas kini ${hhmm(+p.ts)} (Saudi)${stale?" · <b>tiada kemas kini lebih 3 minit</b> (skrin isteri mungkin mati)":""}</p>
    <div class="kstats"><div><span>${T.time}</span><b>${fmtT(el)}</b></div><div><span>${T.dist}</span><b>${fmtD(+p.dist||0)}</b></div><div><span>${T.steps}</span><b>${(+p.steps||0).toLocaleString()}</b></div></div>
    <ol class="ksegs">${T.seg.map((n,j)=>`<li class="${j<p.seg?"ok":j===p.seg?"cur":""}">${j<p.seg?"✓ ":""}${n}${j===1&&p.seg>=1?` ${+p.laps||0}/7`:j===2&&p.seg>=2?` ${+p.legs||0}/7`:""}</li>`).join("")}</ol>`;}
  else h+=`<p class="muted">Tiada rakaman sedang berjalan.</p>`;
  h+=`<h3 class="zh3">Rekod umrah isteri</h3>`+(H.length?H.map(x=>pjRow(x,T)).join(""):`<p class="src">${T.none}</p>`)+`</div>`;
  const open=[...box.querySelectorAll("details")].map(d=>d.open);box.innerHTML=h;box.querySelectorAll("details").forEach((d,i)=>{if(open[i])d.open=true;});}
setInterval(()=>{if(TS&&!TS.done)pjPush(false);if($("pjFam"))pjFamHTML();},5000);
/* sambung semula rakaman yang belum tamat apabila aplikasi dibuka */
try{const c=JSON.parse(localStorage.getItem("su-trk-cur"));if(c&&!c.done&&!TS){TS=c;tlast=null;if(!TS.paused){gpsOn();lockOn();motionOn();}tRun();}}catch(e){}
window.PJ={open(){openTrk();pjFamHTML();},active(){return !!(TS&&!TS.done);}};
if(typeof current!=="undefined"&&current==="penjejak")window.PJ.open();

})();
</script>
</body></html>
