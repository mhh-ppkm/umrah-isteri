 const night=(t.fajr+24)-t.maghrib, third=fix(t.maghrib+night*2/3,24), dS=t.sunrise+20/60, dE=t.dhuhr-10/60, dAf=t.sunrise+(t.dhuhr-t.sunrise)*0.5;
 const tk=todayKey(), fr=fridayDate(), fk=dkey(fr), isFri=new Date().getDay()===5;
 const frLbl=new Intl.DateTimeFormat('ms-MY',{weekday:'long',day:'numeric',month:'long'}).format(fr);
 const now=new Date(), days=Math.round((new Date(fr.getFullYear(),fr.getMonth(),fr.getDate())-new Date(now.getFullYear(),now.getMonth(),now.getDate()))/864e5);
 return `<div><h2>Waktu Berkat</h2><p class="lead">Tiga waktu emas untuk dirancang. Checklist malam & Dhuha bermula semula setiap hari; checklist Jumaat untuk Jumaat yang akan datang.</p></div>

 <div class="panel"><h3>Sepertiga malam terakhir</h3>${winHTML(third,t.fajr)}
  <p class="mk" style="margin:0 0 8px">"Tuhan kita turun ke langit dunia pada sepertiga malam terakhir lalu berfirman: Siapa yang berdoa kepada-Ku, Aku kabulkan; siapa yang meminta, Aku beri; siapa yang memohon ampun, Aku ampunkan." (Bukhari & Muslim)</p>
  ${dailyProg('malam',tk,BK_MALAM.length)}${dailyList('malam',tk,BK_MALAM)}</div>
 <div class="panel"><h3>Waktu Dhuha</h3>${winHTML(dS,dE)}
  <p class="mk" style="margin:0 0 8px">Paling afdal sekitar <b>${hm(dAf)}</b> Saudi (<b>${MYh(dAf)}</b> Malaysia), ketika matahari mula terasa panas.</p>
  ${dailyProg('dhuha',tk,BK_DHUHA.length)}${dailyList('dhuha',tk,BK_DHUHA)}
  <div class="doa" style="margin-top:10px;padding-top:12px;border-top:1px solid var(--line)"><h3>Doa Dhuha</h3><div class="ar" lang="ar">${DHUHA_AR}</div><div class="rumi">${DHUHA_RUMI}</div><div class="mk">${DHUHA_MK}</div></div></div>

  ${dailyProg('jumaat',fk,BK_JUMAAT.length)}${dailyList('jumaat',fk,BK_JUMAAT)}</div>
 <p class="muted" style="font-size:.75rem;margin:0">Masa ialah anggaran untuk ${CITY[S.city].n} hari ini. Ikut azan masjid.</p>`;
}

function updateCounts(){
 const d=day(todayKey()), s=d.counts.selawat||0;
 const n=document.getElementById('n-selawat');
 if(n){n.textContent=s;document.getElementById('tapSel').style.setProperty('--p',Math.min(100,s/SEL_TARGET*100));
  document.getElementById('sel-msg').textContent=s>=SEL_TARGET?'Alhamdulillah, sasaran 1000 hari ini tercapai.':`Baki ${SEL_TARGET-s} lagi untuk hari ini`;}
 ZK.forEach(z=>{const b=document.getElementById('p-'+z.id);if(b){const c=d.counts[z.id]||0;b.textContent=c;b.classList.toggle('done',c>=z.t)}});
 const w=document.getElementById('week');
 if(w){let h='';for(let i=6;i>=0;i--){const dt=new Date();dt.setDate(dt.getDate()-i);const k=dkey(dt);const c=(S.daily&&S.daily[k]&&S.daily[k].counts.selawat)||0;
  h+=`<div class="col"><span>${c}</span><div class="b ${c>=SEL_TARGET?'full':''}" style="height:${Math.max(3,Math.min(1,c/SEL_TARGET)*56)}px"></div><span>${i===0?'Hari ini':new Intl.DateTimeFormat('ms-MY',{weekday:'short'}).format(dt)}</span></div>`}
  w.innerHTML=h}
 const hs=document.getElementById('home-sel');if(hs)hs.textContent=s+' / 1000 hari ini';
}

/* --- geofence (anggaran) --- */
const KAABA=[21.422487,39.826206], SAFA=[21.42195,39.82746], MARWAH=[21.42545,39.82742];
const NABAWI=[24.46723,39.61122], QUBA=[24.43926,39.61722], MADINAH=[24.4686,39.6142], JEDDAH=[21.5433,39.1728], JED_AP=[21.6796,39.1565], MED_AP=[24.5534,39.7051];
function meters(a,b){const R=6371000,x=(b[1]-a[1])*Math.PI/180*Math.cos((a[0]+b[0])/2*Math.PI/180),y=(b[0]-a[0])*Math.PI/180;return Math.hypot(x,y)*R}
function segDist(p,a,b){const k=111320,kx=k*Math.cos(p[0]*Math.PI/180);const ax=(a[1]-p[1])*kx,ay=(a[0]-p[0])*k,bx=(b[1]-p[1])*kx,by=(b[0]-p[0])*k;
 const dx=bx-ax,dy=by-ay;let t=-(ax*dx+ay*dy)/(dx*dx+dy*dy);t=Math.max(0,Math.min(1,t));return Math.hypot(ax+t*dx,ay+t*dy)}
function detectZone(lat,lng,acc,speed,info){
 const p=[lat,lng],good=acc<=80,dK=meters(p,KAABA);
 if(dK<=85&&good) return {k:'tawaf',n:'Kawasan Mataf — kemungkinan sedang tawaf'};
 if(segDist(p,SAFA,MARWAH)<=30&&good) return {k:'saie',n:"Kawasan Mas'a — kemungkinan sedang sa'ie"};
 if(info.hotelMkPos&&meters(p,[info.hotelMkPos.lat,info.hotelMkPos.lng])<=60) return {k:'hotel-mk',n:'Di hotel Makkah'+(info.hotelMakkah?' ('+info.hotelMakkah+')':'')};
 if(info.hotelMdPos&&meters(p,[info.hotelMdPos.lat,info.hotelMdPos.lng])<=60) return {k:'hotel-md',n:'Di hotel Madinah'+(info.hotelMadinah?' ('+info.hotelMadinah+')':'')};
 if(dK<=420) return {k:'haram',n:'Di Masjidil Haram'};
 if(meters(p,NABAWI)<=230) return {k:'nabawi',n:'Di Masjid Nabawi'};
 if(meters(p,QUBA)<=150) return {k:'quba',n:'Di Masjid Quba'};
 if(meters(p,JED_AP)<=3500) return {k:'jed-ap',n:'Di Lapangan Terbang Jeddah'};
 if(meters(p,MED_AP)<=2500) return {k:'med-ap',n:'Di Lapangan Terbang Madinah'};
 if(speed!=null&&speed>4) return {k:'jalan',n:'Dalam perjalanan'};
 if(dK<=15000) return {k:'makkah',n:'Di sekitar Makkah'};
 if(meters(p,MADINAH)<=15000) return {k:'madinah',n:'Di sekitar Madinah'};
 if(meters(p,JEDDAH)<=25000) return {k:'jeddah',n:'Di sekitar Jeddah'};
 return {k:'lain',n:'Lokasi lain'};
}

/* --- auto tracking (isteri) --- */
let watchId=null, wake=null, last={ts:0,k:'',lat:0,lng:0}, lastFix=null, trackUntil=+(lsGet('umrahTrackUntil')||0);
async function reqWake(){try{if('wakeLock' in navigator){wake=await navigator.wakeLock.request('screen');}}catch(e){wake=null}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&watchId!==null)reqWake()});
function tracking(){return watchId!==null&&Date.now()<trackUntil}
function startTracking(resume){
 const m=document.getElementById('trkMsg');
 if(!tripRef){if(m)m.textContent='Sediakan pautan keluarga dan konfigurasi Firebase dahulu.';return}
 if(!navigator.geolocation){if(m)m.textContent='Telefon ini tidak menyokong lokasi.';return}
 if(!resume||Date.now()>=trackUntil){trackUntil=Date.now()+TRACK_HOURS*3600e3;lsSet('umrahTrackUntil',String(trackUntil))}
 if(watchId!==null)navigator.geolocation.clearWatch(watchId);
 if(ecoTimer){clearInterval(ecoTimer);ecoTimer=null}
 watchId=navigator.geolocation.watchPosition(onPos,onPosErr,GPS_OPTS);if(SLEEP===2)gpsEco();
 reqWake();last.ts=0;
 tripRef.set({track:{on:true,until:trackUntil,startedAt:Date.now()}},{merge:true}).catch(()=>{});
 updateTrkUI();
}
function stopTracking(auto){
 if(ecoTimer){clearInterval(ecoTimer);ecoTimer=null}
 if(watchId!==null&&watchId!=='eco')navigator.geolocation.clearWatch(watchId);watchId=null;
 try{wake&&wake.release()}catch(e){}wake=null;trackUntil=0;lsSet('umrahTrackUntil',null);
 if(tripRef)tripRef.set({track:{on:false,until:0,stoppedAt:Date.now(),auto:!!auto}},{merge:true}).catch(()=>{});
 updateTrkUI();
}
function onPosErr(e){const m=document.getElementById('trkMsg');if(m)m.textContent=e.code===1?'Izin lokasi ditolak. Benarkan lokasi untuk Safari: Settings → Privacy & Security → Location Services → Safari Websites → While Using.':'Isyarat GPS lemah — sedang mencuba lagi…'}
function onPos(p){
 if(Date.now()>=trackUntil){stopTracking(true);return}
 const c=p.coords, z=detectZone(c.latitude,c.longitude,c.accuracy,c.speed,INFO()), now=Date.now();
 lastFix={lat:c.latitude,lng:c.longitude,acc:Math.round(c.accuracy),zone:z,ts:now};updateTrkUI();
 const moved=last.ts?meters([last.lat,last.lng],[c.latitude,c.longitude]):1e9, dt=now-last.ts;
 const send=(z.k!==last.k&&dt>=20000)||dt>=180000||(moved>=60&&dt>=60000);
 if(!send||!tripRef)return;
 last={ts:now,k:z.k,lat:c.latitude,lng:c.longitude};
 const pos={lat:+c.latitude.toFixed(6),lng:+c.longitude.toFixed(6),acc:Math.round(c.accuracy),zone:z.k,label:z.n,ts:now};
 pending=true;miniUpdate();
 tripRef.set({pos,track:{on:true,until:trackUntil}},{merge:true}).then(()=>{pending=false;netOk=Date.now();miniUpdate()}).catch(()=>{pending=false;miniUpdate()});
 tripRef.collection('days').doc(saKey()).set({pts:firebase.firestore.FieldValue.arrayUnion(pos)},{merge:true}).catch(()=>{});
}
setInterval(()=>{if(watchId!==null&&Date.now()>=trackUntil)stopTracking(true);updateTrkUI()},30000);
function updateTrkUI(){miniUpdate();
 const b=document.getElementById('trkBtn'),s=document.getElementById('trkState'),m=document.getElementById('trkMsg');if(!b)return;
 if(tracking()){b.textContent='Henti kongsi lokasi';b.dataset.on='1';
  s.innerHTML=`<b style="color:var(--sage)">Aktif</b> hingga ${fmtAt(trackUntil,'Asia/Riyadh')} Saudi · ${lastFix?esc(lastFix.zone.n)+' (±'+lastFix.acc+' m)':'menunggu isyarat GPS…'}`;
  if(m&&!m.dataset.err)m.textContent='Biarkan halaman ini terbuka. Skrin akan kekal hidup; letak telefon dalam beg dengan skrin menghadap ke dalam.';}
 else{b.textContent=`Mula kongsi lokasi auto (${TRACK_HOURS} jam)`;delete b.dataset.on;s.innerHTML=trackUntil&&Date.now()<trackUntil?'Terhenti — tekan butang untuk sambung semula.':'Tidak aktif.'}
}

const GCATS=[['kenangan','Kenangan'],['resit','Resit'],['dokumen','Dokumen']];
let gsel={cat:'kenangan'}, gfilter='semua', GITEMS=null, GERR='', GQ=[];
function UP(){const i=(typeof INFO==='function'?INFO():{})||{};return {url:i.uploadUrl||lsGet('upUrl')||'',token:i.uploadToken||lsGet('upTok')||''}}
function gThumb(id){return 'https://drive.google.com/thumbnail?id='+encodeURIComponent(id)+'&sz=w480'}
function gView(id){return 'https://drive.google.com/file/d/'+encodeURIComponent(id)+'/view'}
function compressImg(file){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);
 img.onload=()=>{const max=1600;let w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(u);
  const d=c.toDataURL('image/jpeg',0.82);res({data:d.split(',')[1],preview:c.toDataURL('image/jpeg',0.4)})};
 img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('Fail bukan gambar'))};img.src=u})}
async function gLoad(){const up=UP();if(!up.url||!up.token){GITEMS=null;gRender();return}
 GERR='';try{const r=await fetch(up.url+(up.url.includes('?')?'&':'?')+'action=list&token='+encodeURIComponent(up.token));const j=await r.json();
  if(!j.ok)throw new Error(j.error||'Gagal');GITEMS=j.items||[]}catch(e){GERR='Tidak dapat memuatkan galeri: '+(e.message||e)}gRender()}
async function gUpload(q){const up=UP();q.st='Memampatkan…';gRender();
 try{if(!q.data){const c=await compressImg(q.file);q.data=c.data;q.preview=c.preview}
  q.st='Memuat naik…';gRender();

function arm(btn,fn){if(btn.dataset.armed){delete btn.dataset.armed;btn.textContent=btn.dataset.label;fn();return}
 btn.dataset.armed='1';btn.dataset.label=btn.textContent;btn.textContent='Tekan sekali lagi untuk sahkan';
 setTimeout(()=>{if(btn.isConnected&&btn.dataset.armed){delete btn.dataset.armed;btn.textContent=btn.dataset.label}},3500);}
main.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset.day){const d=day(t.dataset.day);if(t.checked)d.checks[t.dataset.id]=1;else delete d.checks[t.dataset.id];save();
  const p=document.getElementById('dp-'+t.dataset.grp);if(p)p.outerHTML=dailyProg(t.dataset.grp,p.dataset.key,+p.dataset.n);return;}
 if(t.dataset.id){if(t.checked)S.checks[t.dataset.id]=true;else delete S.checks[t.dataset.id];save();const k=t.dataset.id.split('-')[0];const pg=document.getElementById('pg-'+k);if(pg)pg.innerHTML=progHTML(k);return;}
 if(t.id==='depart'){S.depart=t.value;save();liveUpdate();}
});
main.addEventListener('click',e=>{
 const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return;}
 const c=e.target.closest('[data-city]');if(c){S.city=c.dataset.city;save();render();return;}
 const a=e.target.closest('[data-act]');
 if(a){const z=a.dataset.z,d=day(todayKey());
  if(a.dataset.act==='inc'){d.counts[z]=Math.max(0,(d.counts[z]||0)+Number(a.dataset.n));save();updateCounts();buzz();}
  else if(a.dataset.act==='reset'){arm(a,()=>{d.counts[z]=0;save();updateCounts();});}
  return;}
 const r=e.target.closest('.reset');if(r){arm(r,()=>{const k=r.id.slice(6);Object.keys(S.checks).forEach(id=>{if(id.startsWith(k+'-'))delete S.checks[id]});save();render();});}
});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h)&&h!==current){go(h)}});
let lastDay=todayKey();
setInterval(()=>{if(todayKey()!==lastDay){lastDay=todayKey();render()}},30000);
prune();save();
drawTabs();render();tick();setInterval(tick,1000);setInterval(tickAgo,30000);
</script>

</body></html>
